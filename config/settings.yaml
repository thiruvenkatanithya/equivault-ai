llm:
  model: "llama3.2" # Local Ollama model
  temperature: 0.2
  max_tokens: 1000
  base_url: "http://localhost:11434"

embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"

ingestion:
  strategy: "recursive" # Options: recursive, fixed
  chunk_size: 1000
  chunk_overlap: 150
  separators: ["\n\n", "\n", " ", ""]

acl:
  roles: ["Basic", "Premium", "Admin"]
